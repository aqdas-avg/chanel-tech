<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHANEL Tech Store</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    /* Navbar */
    .navbar {
      background: #111;
      color: white;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    .cart-count {
      background: white;
      color: black;
      padding: 9px 15px;
      border-radius: 5px;
      font-weight: bold;
      white-space: nowrap;
    }

    /* Heading */
    .heading {
      text-align: center;
      padding: 35px 15px;
    }

    .heading h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .heading p {
      color: #666;
    }

    /* Product cards */
    .products {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 25px;
      padding: 10px 6% 40px;
    }

    .card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 12px #00000012;
      transition: transform 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: contain;
      padding: 15px;
      background: #fff;
    }

    .card-content {
      padding: 20px;
    }

    .card h3 {
      margin-bottom: 10px;
      font-size: 18px;
    }

    .description {
      color: #777;
      font-size: 14px;
      min-height: 35px;
      margin-bottom: 12px;
    }

    .price {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .add-btn {
      width: 100%;
      padding: 12px;
      background: #111;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }

    .add-btn:hover {
      background: #444;
    }

    /* Shopping cart */
    .cart-section {
      background: white;
      margin: 0 6% 40px;
      padding: 25px;
      border-radius: 12px;
    }

    .cart-section h2 {
      margin-bottom: 20px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #eee;
      padding: 12px 0;
    }

    .remove-btn {
      padding: 7px 10px;
      background: #eee;
      border: none;
      cursor: pointer;
      border-radius: 4px;
    }

    .total {
      font-size: 22px;
      font-weight: bold;
      text-align: right;
      margin-top: 20px;
    }

    footer {
      text-align: center;
      background: #111;
      color: white;
      padding: 22px;
    }

    @media (max-width: 900px) {
      .products {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 550px) {
      .products {
        grid-template-columns: 1fr;
        padding: 10px 5% 30px;
      }

      .heading h1 {
        font-size: 25px;
      }

      .navbar {
        padding: 16px 5%;
      }

      .logo {
        font-size: 21px;
      }

      .cart-section {
        margin: 0 5% 30px;
        padding: 16px;
      }
    }
  </style>
</head>

<body>

  <nav class="navbar">
    <div class="logo">CHANEL TECH</div>
    <div class="cart-count">
      🛒 Cart (<span id="cartCount">0</span>)
    </div>
  </nav>

  <section class="heading">
    <h1>PC & Laptop Collection</h1>
    <p>Explore our latest gaming PCs, laptops and PC casings.</p>
  </section>

  <main class="products" id="products"></main>

  <section class="cart-section" id="cart">
    <h2>🛒 Your Shopping Cart</h2>
    <div id="cartItems">Your cart is empty.</div>
    <div class="total">
      Total: Rs. <span id="total">0</span>
    </div>
  </section>

  <footer>
    <p>© 2026 CHANEL TECH STORE | All Rights Reserved</p>
  </footer>

  <script>
    const products = [
      {
        name: "Gaming PC Casing",
        description: "Black RGB gaming tower",
        price: 18000,
        image: "https://images.unsplash.com/photo-1587202372775-e229f172b9d7?auto=format&fit=crop&w=600&q=80"
      },
      {
        name: "White Gaming Casing",
        description: "Modern white PC tower",
        price: 22000,
        image: "https://images.unsplash.com/photo-1587202372634-32705e3bf49c?auto=format&fit=crop&w=600&q=80"
      },
      {
        name: "RGB Gaming PC",
        description: "RGB desktop gaming setup",
        price: 95000,
        image: "https://images.unsplash.com/photo-1593640408182-31c70c8268f5?auto=format&fit=crop&w=600&q=80"
      },
      {
        name: "Gaming Laptop",
        description: "Portable performance laptop",
        price: 185000,
        image: "https://images.unsplash.com/photo-1603302576837-37561b2e2302?auto=format&fit=crop&w=600&q=80"
      },
      {
        name: "Business Laptop",
        description: "Slim laptop for everyday work",
        price: 125000,
        image: "https://images.unsplash.com/photo-1496181133206-80ce9b88a853?auto=format&fit=crop&w=600&q=80"
      },
      {
        name: "Desktop Computer",
        description: "Powerful desktop workstation",
        price: 85000,
        image: "https://images.unsplash.com/photo-1587831990711-23ca6441447b?auto=format&fit=crop&w=600&q=80"
      },
      {
        name: "Gaming Monitor",
        description: "Large display for gaming",
        price: 45000,
        image: "https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?auto=format&fit=crop&w=600&q=80"
      },
      {
        name: "PC Keyboard",
        description: "Mechanical-style gaming keyboard",
        price: 6500,
        image: "https://images.unsplash.com/photo-1587829741301-dc798b83add3?auto=format&fit=crop&w=600&q=80"
      },
      {
        name: "Gaming Setup",
        description: "PC accessories and desk setup",
        price: 35000,
        image: "https://images.unsplash.com/photo-1593062096033-9a26b09da705?auto=format&fit=crop&w=600&q=80"
      }
    ];

    const cart = [];

    const productsContainer = document.getElementById("products");

    products.forEach((product, index) => {
      productsContainer.innerHTML += `
        <article class="card">
          <img
            src="${product.image}"
            alt="${product.name}"
            loading="lazy"
          >
          <div class="card-content">
            <h3>${product.name}</h3>
            <p class="description">${product.description}</p>
            <p class="price">Rs. ${product.price.toLocaleString("en-PK")}</p>
            <button class="add-btn" onclick="addToCart(${index})">
              Add to Cart
            </button>
          </div>
        </article>
      `;
    });

    function addToCart(index) {
      cart.push(products[index]);
      renderCart();
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      renderCart();
    }

    function renderCart() {
      document.getElementById("cartCount").textContent = cart.length;

      const cartItems = document.getElementById("cartItems");

      if (cart.length === 0) {
        cartItems.textContent = "Your cart is empty.";
      } else {
        cartItems.innerHTML = cart.map((item, index) => `
          <div class="cart-item">
            <span>${item.name}</span>
            <span>Rs. ${item.price.toLocaleString("en-PK")}</span>
            <button class="remove-btn"
              onclick="removeFromCart(${index})">Remove</button>
          </div>
        `).join("");
      }

      const total = cart.reduce((sum, item) => sum + item.price, 0);

      document.getElementById("total").textContent =
        total.toLocaleString("en-PK");
        document.getElementById("navCartCount").textContent = cart.length;
    }
  </script>

</body>
</html>

</head>
